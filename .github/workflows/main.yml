name: Build PVZ Horror Edition APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد أداة Gradle للسيستم تلقائياً
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. جلب مشروع المحاكي
      - name: Clone Wine Base Runtime
        run: |
          git clone --depth 1 https://github.com/brunodev85/winlator.git android-wrapper
          mkdir -p android-wrapper/app/src/main/assets/game/

      # 5. نقل الملفات وفك ضغط المجلدات
      - name: Copy Game Files and Unzip Folders
        run: |
          cp -r ./* android-wrapper/app/src/main/assets/game/ || true
          cd android-wrapper/app/src/main/assets/game/
          unzip -o folders.zip || true

      # 6. بناء ملف APK باستخدام Gradle المثبت في البيئة
      - name: Build Debug APK
        run: |
          cd android-wrapper
          gradle assembleDebug --stacktrace

      # 7. رفع ملف الـ APK النهائي
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: PVZ_Horror_Edition_APK
          path: android-wrapper/app/build/outputs/apk/debug/*.apk
