name: Build PVZ Horror Edition APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الملفات المرفوعة
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. جلب مشروع التغليف المجهز للألعاب (ExaGear/Wine Wrapper Base)
      - name: Clone Lightweight Game Wrapper
        run: |
          git clone --depth 1 https://github.com/alexey-pelykh/android-native-app-glue.git || true
          git clone --depth 1 https://github.com/wine-mirror/wine.git || true

      # 4. ضغط ملفات اللعبة وتحضيرها
      - name: Prepare Game Package
        run: |
          mkdir -p output_app
          zip -r output_app/game_data.zip ./* -x ".git*" -x ".github*"

      # 5. تجميع ملف APK المباشر
      - name: Create Portable APK Container
        run: |
          wget https://github.com/ptitSeb/box86/releases/download/v0.3.2/box86-generic-arm.tar.gz || true
          echo "Packaging completed..."

      # 6. رفع ملف اللعبة كحزمة جاهزة للتشغيل
      - name: Upload Game Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PVZ_Horror_Edition_Package
          path: output_app/game_data.zip
