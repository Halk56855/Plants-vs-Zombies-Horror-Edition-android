name: Build PVZ Horror Edition APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الملفات المرفوعة في مستودعك
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java لبناء الأندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. جلب قالب مشروع أندرويد مكتمل وجاهز مع gradlew
      - name: Clone Complete Android Wrapper Base
        run: |
          git clone --depth 1 https://github.com/android/architecture-samples.git android-wrapper
          mkdir -p android-wrapper/app/src/main/assets/game/

      # 4. نسخ ملفات اللعبة وفك ضغط المجلدات داخل أصول التطبيق
      - name: Copy Game Files
        run: |
          cp -r ./* android-wrapper/app/src/main/assets/game/ || true
          cd android-wrapper/app/src/main/assets/game/
          unzip -o folders.zip || true

      # 5. إعطاء صلاحيات التشغيل لملف gradlew الموجود بالفطرة
      - name: Grant Permissions
        run: |
          cd android-wrapper
          chmod +x gradlew

      # 6. بناء ملف الـ APK
      - name: Build Debug APK
        run: |
          cd android-wrapper
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. رفع ملف الـ APK الناتج
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: PVZ_Horror_Edition_APK
          path: android-wrapper/app/build/outputs/apk/**/*.apk
