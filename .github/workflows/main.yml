name: Build PVZ Horror Edition APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كافة الملفات المرفوعة في المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تهيئة بيئة Java لبناء تطبيق الأندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. جلب مشغل البيئة (Wine Wrapper Base)
      - name: Clone Wine Base Runtime
        run: |
          git clone https://github.com/brunodev85/winlator.git android-wrapper
          mkdir -p android-wrapper/app/src/main/assets/game/

      # 4. نسخ الملفات وفك ضغط المجلدات المتبقية تلقائياً
      - name: Copy Game Files and Unzip Folders
        run: |
          cp -r ./* android-wrapper/app/src/main/assets/game/ || true
          cd android-wrapper/app/src/main/assets/game/
          unzip -o folders.zip || true

      # 5. منح صلاحيات التشغيل
      - name: Grant Permissions
        run: |
          cd android-wrapper
          chmod +x gradlew

      # 6. بدء بناء ملف الـ APK
      - name: Build Debug APK
        run: |
          cd android-wrapper
          ./gradlew assembleDebug --stacktrace

      # 7. رفع ملف APK الجاهز للحصول على رابط التنزيل
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: PVZ_Horror_Edition_APK
          path: android-wrapper/app/build/outputs/apk/debug/*.apk
          
