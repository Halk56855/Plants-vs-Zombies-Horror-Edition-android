name: Build PVZ Horror Edition APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java لبناء تطبيقات الأندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. تثبيت أدوات Android SDK و NDK المطلوبة للمحاكي
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      # 4. جلب مشروع المحاكي القابل للبناء
      - name: Clone Game Wrapper
        run: |
          git clone --depth 1 https://github.com/brunodev85/winlator.git android-wrapper
          mkdir -p android-wrapper/app/src/main/assets/game/

      # 5. نقل ملفات اللعبة وفك ضغط المجلدات
      - name: Copy Game Files
        run: |
          cp -r ./* android-wrapper/app/src/main/assets/game/ || true
          cd android-wrapper/app/src/main/assets/game/
          unzip -o folders.zip || true

      # 6. بناء ملف APK حقيقي عبر Gradle
      - name: Build Real APK
        run: |
          cd android-wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 7. رفع ملف الـ APK النهائي الحقيقي
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: PVZ_Horror_Edition_APK
          path: android-wrapper/app/build/outputs/apk/debug/*.apk
